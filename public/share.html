<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shared Conversation — Scribe</title>
  <meta name="description" content="View shared conversation snapshot on Scribe." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      padding: 0;
      justify-content: center;
      background: var(--bg-sidebar);
      overflow-y: auto;
      height: auto;
      min-height: 100dvh;
    }
    .share-container {
      max-width: 820px;
      width: 100%;
      margin: 40px auto 80px;
      padding: 0 20px;
    }
    .share-header-card {
      background: var(--bg-surface);
      border: 1px solid var(--line-subtle);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-box);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .share-header-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .share-badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
    }
    .share-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      color: var(--ink-primary);
      line-height: 1.25;
    }
    .share-meta {
      font-size: 0.8rem;
      color: var(--ink-muted);
    }
    .share-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-cta-launch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      transition: all .18s ease;
    }
    .btn-cta-launch:hover {
      background: var(--accent-soft);
      transform: translateY(-2px);
    }
    .share-messages-feed {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .share-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-muted);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="share-container">
    <div class="share-header-card">
      <div class="share-header-left">
        <span class="share-badge">Scribe · Shared Dialogue</span>
        <h1 id="share-title" class="share-title">Loading Conversation…</h1>
        <span id="share-meta" class="share-meta">Read-only archive</span>
      </div>
      <div class="share-header-actions">
        <button id="theme-toggle" class="btn-theme-toggle" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="/" class="btn-cta-launch">
          <span>Open Scribe</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </div>

    <div id="share-content" class="share-messages-feed">
      <div class="share-loading">Retrieving archived conversation…</div>
    </div>
  </div>

  <script src="share.js"></script>
</body>
</html>
