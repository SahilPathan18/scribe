<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen — Conversational Intelligence</title>
  <meta name="description" content="Lumen is a thoughtful, editorial conversational AI workspace." />
  
  <!-- Typography: Newsreader (Editorial Serif), Plus Jakarta Sans (Clean UI Sans), JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;450;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───────── Sidebar ───────── -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Lumen</span>
          <span class="brand-edition">v2.0 · Journal</span>
        </div>
        <button id="sidebar-collapse-btn" class="btn-sidebar-icon" aria-label="Collapse sidebar" title="Collapse sidebar (Ctrl+B)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <line x1="9" y1="3" x2="9" y2="21" />
          </svg>
        </button>
      </div>

      <button id="new-chat-btn" class="btn-new-chat" title="Start new chat (Ctrl+N)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span>New Chat</span>
      </button>
    </div>

    <div class="sidebar-section-title">Chats</div>

    <nav id="chat-list" class="chat-list" aria-label="Conversation archive">
      <!-- chat items populated dynamically -->
    </nav>

    <div class="sidebar-footer">
      <div class="system-status">
        <span class="status-dot"></span>
        <span>Gemini 2.0 Flash</span>
      </div>
      <button id="clear-all-btn" class="btn-clear-archive" title="Clear all chats">Clear chats</button>
    </div>
  </aside>

  <!-- ───────── Main Content Area ───────── -->
  <main class="main" id="main">

    <!-- Top quiet bar -->
    <header class="top-nav">
      <div class="top-nav-left">
        <button id="sidebar-toggle" class="btn-sidebar-icon" aria-label="Toggle sidebar" title="Toggle sidebar (Ctrl+B)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <line x1="9" y1="3" x2="9" y2="21" />
          </svg>
        </button>
        <div class="current-chat-title" id="active-chat-title">New Chat</div>
      </div>
      <div class="top-nav-actions">
        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle light or dark theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Welcome stage (minimal, unbloated) -->
    <div id="welcome" class="welcome">
      <div class="welcome-container">
        <h1 class="welcome-heading">How can I help you today?</h1>
      </div>
    </div>

    <!-- Active conversation feed -->
    <div id="messages" class="messages" role="log" aria-live="polite"></div>

    <!-- Reflecting / typing indicator -->
    <div id="typing-indicator" class="typing-indicator hidden" aria-hidden="true">
      <div class="indicator-monogram">L</div>
      <div class="indicator-content">
        <div class="indicator-shimmer">
          <span></span><span></span><span></span>
        </div>
        <span class="indicator-caption">Lumen is drafting…</span>
      </div>
    </div>

    <!-- Composer bar -->
    <div class="composer-container">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <div class="composer-frame">
          <textarea
            id="message-input"
            rows="1"
            placeholder="Write your inquiry or question…"
            aria-label="Write a message"
            required
          ></textarea>
          
          <div class="composer-actions">
            <span class="composer-hint"><kbd>↵</kbd> send &nbsp;·&nbsp; <kbd>⇧↵</kbd> newline</span>
            <button type="submit" id="send-btn" class="btn-send" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
              </svg>
            </button>
          </div>
        </div>
      </form>
      <div class="composer-footer">
        <span>Lumen delivers responses using Google Gemini. Verify critical technical citations.</span>
      </div>
    </div>

  </main>

  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
